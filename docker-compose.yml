version: "3.8"

services:
  yubilab-worker:
    build: .
    container_name: yubilab-worker
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - workspaces:~/yubilab-workspaces
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  workspaces:
  uploads:
